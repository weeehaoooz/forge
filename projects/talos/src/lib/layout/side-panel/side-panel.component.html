<div class="side-panel-inner">
  <div class="side-panel-header">
    <h3 class="side-panel-title">
      {{ title() }}
    </h3>
    <button type="button" talosButton variant="ghost" size="sm" [iconOnly]="true" class="side-panel-close-btn"
      (click)="onClose()" aria-label="Close details panel">
      <svg lucideX [size]="16"></svg>
    </button>
  </div>
  <div class="side-panel-body">
    @if (component()) {
    <ng-container *ngComponentOutlet="component()!; inputs: componentInputs()" />
    }
    <ng-content />
  </div>
</div>
