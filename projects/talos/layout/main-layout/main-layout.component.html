<div class="layout-body-wrapper">
  <!-- Side Nav Slot (Accepts talos-side-nav, app-side-nav, or elements with [side-nav]) -->
  <ng-content select="talos-side-nav, app-side-nav, [side-nav]" />

  <!-- Main Content Container Area -->
  <div class="main-content-wrapper">
    <main class="main-content-container" role="main">
      <ng-content />
    </main>

    <!-- Optional Blur Backdrop Overlay -->
    @if (layoutService.shouldBlurMainContent()) {
    <div class="main-backdrop-overlay" (click)="onBackdropClick()" aria-hidden="true"></div>
    }
  </div>

  <!-- Dynamic Right Side Panel Drawer Component -->
  <talos-side-panel [isOpen]="layoutService.isRightPanelOpen()"
    [title]="layoutService.rightPanelOptions().title ?? 'Details'"
    [width]="layoutService.rightPanelOptions().width ?? '380px'"
    [mode]="layoutService.rightPanelOptions().mode ?? 'overlay'" [component]="layoutService.rightPanelComponent()"
    [componentInputs]="layoutService.rightPanelInputs()" (close)="layoutService.closeRightPanel()" />
</div>
