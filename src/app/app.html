<forge-main-layout>
  <!-- Side Navigation Component Slot -->
  <forge-side-nav side-nav [navGroups]="navGroups()" (itemClick)="onNavItemClick($event)">
    <div side-nav-logo class="app-custom-logo">
      <div class="logo-icon-badge">
        <svg lucideHexagon [size]="20"></svg>
      </div>
      <span class="logo-text">The Forge</span>
    </div>
  </forge-side-nav>

  <!-- Main Content Area -->
  <div class="demo-page-wrapper">
    <router-outlet />
  </div>
</forge-main-layout>
