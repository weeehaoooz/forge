<div class="demo-page-content">
  <header class="page-header">
    <div class="badge">talos/components · Input Fields</div>
    <h1>Inputs Showcase</h1>
    <p class="subtitle">
      Styled text input and textarea components matching design system variables,
      with size variants and reactive form integration.
    </p>
  </header>

  <main class="demo-grid">
    <form [formGroup]="inputsForm" class="card form-card">
      <div class="card-header">
        <div>
          <h2>Form Controls (Inputs &amp; Textarea)</h2>
          <span class="card-subtitle">Standardized styling matching _variables.scss</span>
        </div>
        <div class="actions">
          <talos-button-group size="sm" variant="segmented" selectionMode="single"
            [value]="floatingLabels() ? 'floating' : 'static'"
            (valueChange)="floatingLabels.set($event === 'floating')">
            <button type="button" talosButton talosButtonGroupItem value="static" tooltip="Static Top Labels">Static
              Label</button>
            <button type="button" talosButton talosButtonGroupItem value="floating"
              tooltip="Floating Inline Labels">Floating Label</button>
          </talos-button-group>

          <talos-button-group size="sm" variant="segmented" selectionMode="single" [value]="inputSize()"
            (valueChange)="setInputSize($event)">
            <button type="button" talosButton talosButtonGroupItem value="sm"
              tooltip="Compact Size (32px)">Compact</button>
            <button type="button" talosButton talosButtonGroupItem value="md"
              tooltip="Medium Size (36px)">Medium</button>
            <button type="button" talosButton talosButtonGroupItem value="lg" tooltip="Large Size (42px)">Large</button>
          </talos-button-group>

          <button type="button" talosButton variant="outline" size="sm" (click)="toggleDisableForm()">
            {{ isFormDisabled() ? 'Enable Form' : 'Disable Form' }}
          </button>
        </div>
      </div>

      <div class="form-fields">
        <!-- Text Input with Form Field -->
        <talos-form-field label="Project Name" [floating]="floatingLabels()" [required]="true" [size]="inputSize()"
          [error]="inputsForm.controls.projectName.touched && inputsForm.controls.projectName.hasError('required') ? 'Project name is required.' : ''">
          <input id="project-name" type="text" talosInput formControlName="projectName"
            placeholder="e.g. NextGen Dashboard" [size]="inputSize()" />
        </talos-form-field>

        <!-- Textarea with Form Field -->
        <talos-form-field label="Project Description" [floating]="floatingLabels()" [size]="inputSize()"
          hint="Optional. Supports multi-line input and resizing.">
          <textarea id="project-desc" talosTextarea formControlName="projectDescription"
            placeholder="Enter detailed project scope or comments..." [size]="inputSize()" rows="3"></textarea>
        </talos-form-field>
      </div>
    </form>
  </main>
</div>
